/**
 * 生成版本名
 */
static String createVersionName(int code) {
    int num1 = (int) (code / 100)
    int num2 = (int) ((code - num1 * 100) / 10)
    int num3 = code - num1 * 100 - num2 * 10
    return num1 + "." + num2 + "." + num3
}

/**
 * 生成jar源码
 */
tasks.register('sourcesJar', Jar) {
    from android.sourceSets.main.java.srcDirs
    //noinspection GrDeprecatedAPIUsage
    classifier = 'sources'
}

/**
 * 生成javadoc
 */
tasks.register('javadoc', Jar) {
    from javadoc.destinationDirectory
    //noinspection GrDeprecatedAPIUsage
    classifier = 'javadoc'
}

/**
 * archives管理源码和文档
 */
artifacts {
    archives sourcesJar
    archives javadoc
}